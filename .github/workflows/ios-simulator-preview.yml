name: iOS simulator preview

# Manual only: Actions tab -> "iOS simulator preview" -> Run workflow.
# Produces screenshots + an mp4 of the example app on a real iOS simulator,
# downloadable from the run's Artifacts section.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device name
        default: iPhone 16 Pro
      seconds:
        description: Extra seconds to keep recording
        default: '15'
      appearance:
        description: light or dark
        default: dark

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: What Xcode / runtimes did we get
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Pub get
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Boot simulator
        id: sim
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,os,sys
          d=json.load(sys.stdin)['devices']
          want=os.environ['DEVICE']
          hits=[x['udid'] for r in d for x in d[r] if x['name']==want]
          if not hits: sys.exit('no simulator named '+want)
          print(hits[0])")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance ${{ inputs.appearance }}

      - name: Build for simulator
        working-directory: example
        run: flutter build ios --simulator --debug

      - name: Install app
        id: app
        working-directory: example
        run: |
          APP=build/ios/iphonesimulator/Runner.app
          xcrun simctl install ${{ steps.sim.outputs.udid }} "$APP"
          echo "bundle=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" >> $GITHUB_OUTPUT

      # Optional: gives us tap/swipe so the slider and nav bar can be driven.
      # If it fails we still get launch screenshots + video.
      - name: Install idb
        id: idb
        continue-on-error: true
        run: |
          brew tap facebook/fb
          brew install idb-companion
          pip3 install --break-system-packages fb-idb

      - name: Run and capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUNDLE: ${{ steps.app.outputs.bundle }}
        run: |
          mkdir -p artifacts
          xcrun simctl io "$UDID" recordVideo --codec h264 --force artifacts/run.mp4 &
          REC=$!

          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 8
          xcrun simctl io "$UDID" screenshot artifacts/01-gallery.png

          # Coordinates are points on a 393x852 iPhone. Adjust to reach the
          # page you care about, then re-run. Each block is one interaction.
          if command -v idb >/dev/null 2>&1; then
            idb ui tap --udid "$UDID" 196 300 || true
            sleep 3
            xcrun simctl io "$UDID" screenshot artifacts/02-page.png

            # drag left-to-right across a slider band
            idb ui swipe --udid "$UDID" 60 500 340 500 --duration 1.5 || true
            sleep 2
            xcrun simctl io "$UDID" screenshot artifacts/03-after-drag.png
          fi

          sleep ${{ inputs.seconds }}
          kill -INT $REC || true
          wait $REC || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-preview
          path: artifacts/
