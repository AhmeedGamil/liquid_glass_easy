
name: liquid_glass_easy_example
description: "Example app demonstrating the usage of liquid_glass_easy package."
publish_to: "none"

environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The SF Symbol look-alikes on the Apple Match page.
  cupertino_icons: ^1.0.8
  liquid_glass_easy:
    path: ../
  # Apple's real controls on iOS and macOS (UIKit/AppKit platform views),
  # shown live in Apple Match. Vendored so the controls keep their system
  # colours: upstream forces the Flutter theme's primary colour onto every
  # control as a tint.
  cupertino_native:
    path: third_party/cupertino_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Apple Match: the backdrops, and Apple's controls as iOS screenshots,
    # one folder per iOS release.
    - assets/apple_match/
    - assets/apple_match/reference/ios26/
    - assets/apple_match/reference/ios27/
