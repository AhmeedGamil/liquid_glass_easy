name: liquid_glass_web_demos
description: "Live, embeddable web demos for the liquid_glass_easy docs site."
publish_to: "none"
version: 1.0.0+1

# Matches the package under demo, so the two resolve against one SDK.
environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The package under demo, straight from this repo — a demo can never drift
  # from the code it documents.
  liquid_glass_easy:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
