
name: liquid_glass_easy_example
description: "Example app demonstrating the usage of liquid_glass_easy package."
publish_to: "none"

environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.3.0
  liquid_glass_easy:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Outline + filled SVG pairs driving the "Scaffold + SVG Nav" demo.
    - assets/icons/
